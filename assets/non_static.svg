<svg viewBox="0 0 700 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ede6ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradOuterNS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A259FF;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#7a2fb8;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="gradInnerNS" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F7934F;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#d96f2e;stop-opacity:0.9" />
    </linearGradient>
    <marker id="arrowheadBold" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#EF476F" />
    </marker>
  </defs>
  
  <rect width="700" height="350" fill="url(#gradBg2)" />
  
  <!-- Title -->
  <text x="350" y="30" font-size="16" font-weight="bold" fill="#333" font-family="Segoe UI, Arial" text-anchor="middle">Non-Static Inner Class (Instance Binding)</text>
  
  <!-- Outer Instance -->
  <rect x="40" y="60" width="280" height="140" rx="8" fill="url(#gradOuterNS)" stroke="#7a2fb8" stroke-width="2" />
  <text x="60" y="85" font-size="14" font-weight="bold" fill="white" font-family="Segoe UI, Arial">Outer Instance</text>
  <text x="60" y="105" font-size="11" fill="white" font-family="Segoe UI, Arial">company_name = "TechCorp"</text>
  
  <!-- Instance badge -->
  <circle cx="260" cy="75" r="16" fill="#FFD166" />
  <text x="260" y="82" font-size="11" font-weight="bold" fill="#333" font-family="Segoe UI, Arial" text-anchor="middle">obj1</text>
  
  <!-- Inner Instance -->
  <rect x="360" y="60" width="300" height="140" rx="8" fill="url(#gradInnerNS)" stroke="#d96f2e" stroke-width="2" />
  <text x="380" y="85" font-size="14" font-weight="bold" fill="white" font-family="Segoe UI, Arial">Inner Instance</text>
  <text x="380" y="105" font-size="11" fill="white" font-family="Segoe UI, Arial">employee_name = "Aju Kumar"</text>
  <text x="380" y="125" font-size="11" fill="white" font-family="Segoe UI, Arial">outer_instance = (reference)</text>
  
  <!-- Instance badge -->
  <circle cx="630" cy="75" r="16" fill="#FFD166" />
  <text x="630" y="82" font-size="11" font-weight="bold" fill="#333" font-family="Segoe UI, Arial" text-anchor="middle">obj2</text>
  
  <!-- Explicit Reference Arrow -->
  <path d="M 320 120 L 360 120" stroke="#EF476F" stroke-width="3" fill="none" marker-end="url(#arrowheadBold)" />
  <text x="330" y="112" font-size="11" fill="#EF476F" font-weight="bold" font-family="Segoe UI, Arial">Explicit</text>
  <text x="330" y="125" font-size="11" fill="#EF476F" font-weight="bold" font-family="Segoe UI, Arial">Reference</text>
  
  <!-- Code Patterns -->
  <rect x="40" y="230" width="620" height="100" rx="8" fill="rgba(0,0,0,0.03)" stroke="#ccc" stroke-width="1" />
  
  <text x="60" y="253" font-size="12" font-weight="bold" fill="#333" font-family="Segoe UI, Arial">Pattern 1: Pass to Method</text>
  <text x="60" y="272" font-size="10" fill="#555" font-family="monospace">inner.display_info(outer)  # Pass outer instance</text>
  
  <text x="360" y="253" font-size="12" font-weight="bold" fill="#333" font-family="Segoe UI, Arial">Pattern 2: Store in Constructor (✓ Cleaner)</text>
  <text x="360" y="272" font-size="10" fill="#555" font-family="monospace">inner = outer.Inner("Aju", outer)  # Store reference</text>
  <text x="360" y="290" font-size="10" fill="#555" font-family="monospace">inner.display_info()  # No explicit passing needed</text>
  
  <!-- Key note -->
  <text x="40" y="345" font-size="10" fill="#666" font-family="Segoe UI, Arial">⚠️ Key Difference from Java: Python requires explicit reference passing; Java provides implicit outer context</text>
</svg>