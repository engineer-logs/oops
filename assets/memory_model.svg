<svg width="640" height="210" viewBox="0 0 640 210" xmlns="http://www.w3.org/2000/svg" font-family="monospace, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="640" height="210" fill="#ffffff" rx="0"/>

  <!-- CLASS block -->
  <rect x="20" y="30" width="190" height="90" rx="10" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="1"/>
  <text x="115" y="54" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489" font-family="sans-serif">Class: Student</text>
  <rect x="36" y="64" width="158" height="30" rx="6" fill="#D8D5F8" stroke="#AFA9EC" stroke-width="0.8"/>
  <text x="115" y="83" text-anchor="middle" font-size="12" fill="#3C3489" font-family="monospace">school = "ABC School"</text>
  <text x="115" y="136" text-anchor="middle" font-size="11" fill="#7F77DD" font-family="sans-serif">class variable (shared)</text>

  <!-- s1 block -->
  <rect x="260" y="20" width="160" height="80" rx="10" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1"/>
  <text x="340" y="44" text-anchor="middle" font-size="13" font-weight="600" fill="#085041" font-family="sans-serif">s1 object</text>
  <rect x="274" y="54" width="132" height="28" rx="6" fill="#9FE1CB" stroke="#5DCAA5" stroke-width="0.8"/>
  <text x="340" y="72" text-anchor="middle" font-size="12" fill="#04342C" font-family="monospace">name = "Jake"</text>
  <text x="340" y="112" text-anchor="middle" font-size="11" fill="#0F6E56" font-family="sans-serif">instance variable</text>

  <!-- s2 block -->
  <rect x="460" y="20" width="160" height="80" rx="10" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1"/>
  <text x="540" y="44" text-anchor="middle" font-size="13" font-weight="600" fill="#085041" font-family="sans-serif">s2 object</text>
  <rect x="474" y="54" width="132" height="28" rx="6" fill="#9FE1CB" stroke="#5DCAA5" stroke-width="0.8"/>
  <text x="540" y="72" text-anchor="middle" font-size="12" fill="#04342C" font-family="monospace">name = "Emily"</text>
  <text x="540" y="112" text-anchor="middle" font-size="11" fill="#0F6E56" font-family="sans-serif">instance variable</text>

  <!-- arrows from s1,s2 to class -->
  <line x1="260" y1="60" x2="212" y2="79" stroke="#7F77DD" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="460" y1="60" x2="212" y2="79" stroke="#7F77DD" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <text x="320" y="175" text-anchor="middle" font-size="11" fill="#7F77DD" font-family="sans-serif">both objects reference the same class variable</text>
</svg>
