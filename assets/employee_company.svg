<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Company Box -->
  <rect x="50" y="50" width="300" height="300" fill="url(#grad1)" rx="10" stroke="#fff" stroke-width="2"/>
  <text x="70" y="80" font-size="20" font-weight="bold" fill="#fff" font-family="Arial">Company (Outer)</text>
  
  <text x="70" y="120" font-size="13" fill="#fff" font-family="Arial">• __name: str</text>
  <text x="70" y="145" font-size="13" fill="#fff" font-family="Arial">• __location: str</text>
  <text x="70" y="170" font-size="13" fill="#fff" font-family="Arial">• __employees: dict</text>
  
  <text x="70" y="205" font-size="13" fill="#fff" font-family="Arial">Methods:</text>
  <text x="70" y="230" font-size="12" fill="#fff" font-family="Arial">add_employee(), edit_employee()</text>
  <text x="70" y="255" font-size="12" fill="#fff" font-family="Arial">list_employees(), total_payroll()</text>
  <text x="70" y="280" font-size="12" fill="#fff" font-family="Arial">get_company_info()</text>
  
  <!-- Employee Box (inside Company visually) -->
  <rect x="400" y="50" width="320" height="300" fill="url(#grad2)" rx="10" stroke="#fff" stroke-width="2"/>
  <text x="420" y="80" font-size="20" font-weight="bold" fill="#fff" font-family="Arial">Employee (Inner)</text>
  
  <text x="420" y="120" font-size="13" fill="#fff" font-family="Arial">• __company: Company</text>
  <text x="420" y="145" font-size="13" fill="#fff" font-family="Arial">• __id: int</text>
  <text x="420" y="170" font-size="13" fill="#fff" font-family="Arial">• __name, __position, __email</text>
  <text x="420" y="195" font-size="13" fill="#fff" font-family="Arial">• __salary: float</text>
  <text x="420" y="220" font-size="13" fill="#fff" font-family="Arial">• __active: bool</text>
  
  <text x="420" y="255" font-size="12" fill="#fff" font-family="Arial">Properties: name, position, email, salary</text>
  <text x="420" y="280" font-size="12" fill="#fff" font-family="Arial">Methods: deactivate(), get_employee_info()</text>
  
  <!-- Arrow showing reference -->
  <path d="M 350 200 L 400 200" stroke="#FFD700" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <text x="360" y="190" font-size="12" fill="#FFD700" font-family="Arial" font-weight="bold">reference</text>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#FFD700"/>
    </marker>
  </defs>
</svg>