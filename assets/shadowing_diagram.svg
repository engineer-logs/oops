<svg width="640" height="180" viewBox="0 0 640 180" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="640" height="180" fill="#ffffff"/>

  <!-- Class -->
  <rect x="20" y="30" width="170" height="80" rx="10" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="1"/>
  <text x="105" y="54" text-anchor="middle" font-size="13" font-weight="600" fill="#3C3489">CSStudent class</text>
  <rect x="34" y="62" width="142" height="28" rx="6" fill="#D8D5F8" stroke="#AFA9EC" stroke-width="0.8"/>
  <text x="105" y="80" text-anchor="middle" font-size="12" fill="#3C3489" font-family="monospace">stream = 'cse'</text>

  <!-- object a -->
  <rect x="240" y="20" width="175" height="110" rx="10" fill="#FAECE7" stroke="#F0997B" stroke-width="1"/>
  <text x="327" y="44" text-anchor="middle" font-size="13" font-weight="600" fill="#4A1B0C">object a</text>
  <rect x="254" y="54" width="147" height="28" rx="6" fill="#F5C4B3" stroke="#F0997B" stroke-width="0.8"/>
  <text x="327" y="72" text-anchor="middle" font-size="12" fill="#4A1B0C" font-family="monospace">stream = 'ece'</text>
  <text x="327" y="100" text-anchor="middle" font-size="10" fill="#993C1D">new instance variable (shadows class)</text>

  <!-- object b -->
  <rect x="450" y="30" width="170" height="80" rx="10" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="1"/>
  <text x="535" y="54" text-anchor="middle" font-size="13" font-weight="600" fill="#085041">object b</text>
  <text x="535" y="78" text-anchor="middle" font-size="11" fill="#0F6E56">no own stream →</text>
  <text x="535" y="94" text-anchor="middle" font-size="11" fill="#0F6E56">still reads class var</text>

  <!-- b arrow to class -->
  <line x1="450" y1="70" x2="192" y2="70" stroke="#0F6E56" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow2)"/>

  <text x="320" y="160" text-anchor="middle" font-size="11" fill="#993C1D">a.stream = 'ece' only affects object a — class variable is untouched</text>
</svg>
