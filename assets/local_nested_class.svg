<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fff5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6fff0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gradMethod" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34C97C;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#1a9d5e;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="gradLocal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F8EF7;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#2e5bc8;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <rect width="700" height="380" fill="url(#gradBg3)" />
  
  <!-- Title -->
  <text x="350" y="30" font-size="16" font-weight="bold" fill="#333" font-family="Segoe UI, Arial" text-anchor="middle">Local Inner Class Scope & Access</text>
  
  <!-- Method block -->
  <rect x="40" y="60" width="620" height="290" rx="8" fill="url(#gradMethod)" stroke="#1a9d5e" stroke-width="2" />
  <text x="60" y="85" font-size="13" font-weight="bold" fill="white" font-family="Segoe UI, Arial">def method_with_inner_class(self, value):</text>
  
  <!-- Method scope -->
  <rect x="70" y="105" width="580" height="230" rx="6" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="2" stroke-dasharray="5,5" />
  <text x="85" y="128" font-size="11" fill="white" font-family="Segoe UI, Arial">Method Local Variables & Inner Class Scope</text>
  
  <!-- Local variables -->
  <rect x="85" y="145" width="180" height="70" rx="4" fill="rgba(0,0,0,0.2)" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
  <text x="100" y="165" font-size="11" fill="white" font-family="Segoe UI, Arial">x = 10 (local variable)</text>
  <text x="100" y="183" font-size="11" fill="white" font-family="Segoe UI, Arial">value = 42 (parameter)</text>
  <text x="100" y="201" font-size="10" fill="#FFD166" font-family="Segoe UI, Arial">✓ Accessible in LocalInner</text>
  
  <!-- Local inner class -->
  <rect x="310" y="145" width="330" height="180" rx="4" fill="url(#gradLocal)" stroke="#2e5bc8" stroke-width="2" />
  <text x="325" y="165" font-size="11" font-weight="bold" fill="white" font-family="Segoe UI, Arial">class LocalInner:</text>
  
  <rect x="325" y="180" width="300" height="130" rx="3" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.4)" stroke-width="1" />
  <text x="340" y="200" font-size="10" fill="white" font-family="Segoe UI, Arial">Can access:</text>
  <text x="350" y="218" font-size="10" fill="#FFD166" font-family="Segoe UI, Arial">✓ x, value (method scope)</text>
  <text x="350" y="235" font-size="10" fill="#FFD166" font-family="Segoe UI, Arial">✓ Outer.class_var (static)</text>
  <text x="350" y="252" font-size="10" fill="#EF476F" font-family="Segoe UI, Arial">✗ self.company_name (need explicit pass)</text>
  <text x="340" y="278" font-size="10" fill="white" font-family="Segoe UI, Arial">⚠️ Scoped ONLY to this method</text>
  
  <!-- Key Differences box -->
  <rect x="40" y="360" width="620" height="auto" rx="6" fill="rgba(255,209,102,0.15)" stroke="#FFD166" stroke-width="1" />
  <text x="60" y="378" font-size="10" fill="#666" font-family="Segoe UI, Arial">🔑 Python vs Java: Python allows modifying local variables (x += 1); Java requires 'final' keyword. Scope is method-only in both.</text>
</svg>